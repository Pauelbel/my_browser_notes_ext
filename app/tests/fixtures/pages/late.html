<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="style.css"><title>Поздняя отрисовка</title></head><body>
<h1>Поздняя отрисовка</h1>
<div id="slot"></div>
<button id="later" disabled onclick="document.getElementById('status').textContent='Включённая нажата'">Станет активной</button>
<div id="status">Статус: ждём</div>
<script>
fetch('/slow?ms=800').then(() => { const b = document.createElement('button'); b.textContent = 'Появилась позже'; b.onclick = () => document.getElementById('status').textContent = 'Поздняя нажата'; document.getElementById('slot').append(b); });
setTimeout(() => { document.getElementById('later').disabled = false; }, 1200);
</script>
</body></html>
