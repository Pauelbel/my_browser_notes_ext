<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="style.css"><title>Меню</title><style>
.menu{display:inline-block;position:relative}.menu .items{display:none;position:absolute;background:#fff;border:1px solid #888;padding:4px}

<h1>Меню по наведению</h1>
<div class="menu"><button>Профиль</button><div class="items"><button onclick="document.getElementById('status').textContent='Выход выбран'">Выйти из профиля</button></div></div>
<div id="status" style="margin-top:80px">Статус: ждём</div>
</body></html>
