<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="style.css"><title>Баннер</title><style>
#banner{position:fixed;left:0;right:0;bottom:0;top:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center}
#banner div{background:#fff;padding:24px;max-width:400px}</style></head><body>
<h1>Страница с баннером</h1>

<div id="banner"><div><p>Мы используем cookies, чтобы сайт работал лучше.</p><button onclick="document.getElementById('banner').remove()">Принять</button></div></div>
</body></html>
